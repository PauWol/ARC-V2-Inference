[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-inference"
version = "1.0.0"
description = "Easy Python client and agent SDK for an OpenAI-compatible inference API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["arc_inference"]
